<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chess Match</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="match-container">

    <div class="game-info">
      <div class="player-card opponent">
        <div class="player-role" id="opponentRole">Black</div>
        <div class="player-name" id="opponentName">Opponent</div>
      </div>

      <div class="turn-indicator" id="turnIndicator">Loading…</div>

      <div class="player-card you">
        <div class="player-role" id="yourRole">White</div>
        <div class="player-name" id="yourName">You</div>
      </div>
    </div>

    <div id="board" class="board"></div>

    <div id="status" class="match-status"></div>

  </div>
  <script src="match.js"></script>
</body>
</html>
