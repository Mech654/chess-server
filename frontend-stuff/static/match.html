<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chess Match</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="match-container">

    <div class="player-bar opponent-bar">
      <span class="bar-name" id="opponentName">Opponent</span>
      <span class="bar-role" id="opponentRole">Black</span>
    </div>

    <div id="board" class="board"></div>

    <div class="player-bar your-bar">
      <span class="bar-name" id="yourName">You</span>
      <span class="bar-role" id="yourRole">White</span>
    </div>

    <div class="turn-indicator" id="turnIndicator">Loading…</div>
    <div id="status" class="match-status"></div>

  </div>
  <script src="match.js"></script>
</body>
</html>
